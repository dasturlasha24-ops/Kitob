<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="book-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="book-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- Subtle glow behind knowledge book -->
  <circle cx="256" cy="256" r="140" fill="#3b82f6" opacity="0.2" filter="url(#glow)" />
  <circle cx="256" cy="180" r="70" fill="#f59e0b" opacity="0.25" filter="url(#glow)" />

  <!-- Wisdom / Knowledge Flame & Spark -->
  <g transform="translate(256, 175) scale(1.1)">
    <!-- Central flame -->
    <path d="M0,-55 C18,-30 25,-10 15,10 C8,22 -8,22 -15,10 C-25,-10 -18,-30 0,-55 Z" fill="url(#gold-grad)" filter="url(#glow)" />
    <!-- Core star of wisdom -->
    <polygon points="0,-25 6,-7 24,-7 10,4 15,22 0,11 -15,22 -10,4 -24,-7 -6,-7" fill="#ffffff" opacity="0.95" transform="scale(0.85)" />
  </g>

  <!-- Open Book of Knowledge -->
  <g transform="translate(256, 310)">
    <!-- Book Left Page Stack -->
    <path d="M-15,-70 C-65,-85 -145,-75 -185,-50 L-185,55 C-145,35 -65,30 -15,45 Z" fill="#1e293b" opacity="0.6" />
    
    <!-- Book Right Page Stack -->
    <path d="M15,-70 C65,-85 145,-75 185,-50 L185,55 C145,35 65,30 15,45 Z" fill="#1e293b" opacity="0.6" />

    <!-- Main Left Page -->
    <path d="M-10,-60 C-60,-78 -135,-70 -175,-48 C-178,-46 -180,-43 -180,-40 L-180,48 C-180,52 -176,55 -172,53 C-135,35 -65,30 -10,48 Z" fill="url(#book-grad-left)" />
    
    <!-- Main Right Page -->
    <path d="M10,-60 C60,-78 135,-70 175,-48 C178,-46 180,-43 180,-40 L180,48 C180,52 176,55 172,53 C135,35 65,30 10,48 Z" fill="url(#book-grad-right)" />

    <!-- Spine / Center Ridge -->
    <path d="M-10,-55 Q0,-65 10,-55 L10,50 Q0,40 -10,50 Z" fill="#38bdf8" />
    
    <!-- Page lines (Knowledge lines) Left -->
    <line x1="-145" y1="-25" x2="-40" y2="-38" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round" />
    <line x1="-145" y1="-2" x2="-40" y2="-15" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round" />
    <line x1="-145" y1="21" x2="-60" y2="8" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round" />

    <!-- Page lines (Knowledge lines) Right -->
    <line x1="40" y1="-38" x2="145" y2="-25" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round" />
    <line x1="40" y1="-15" x2="145" y2="-2" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round" />
    <line x1="60" y1="8" x2="145" y2="21" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
